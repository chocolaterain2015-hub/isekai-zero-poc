<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isekai Zero PoC</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 20px;
      color: #00d4ff;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 5px;
      padding: 15px;
    }

    .panel h2 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #00d4ff;
      border-bottom: 1px solid #0f3460;
      padding-bottom: 10px;
    }

    textarea {
      width: 100%;
      padding: 10px;
      background: #0f3460;
      border: 1px solid #00d4ff;
      color: #eee;
      border-radius: 3px;
      font-family: monospace;
      font-size: 12px;
      resize: vertical;
      margin-bottom: 10px;
    }

    textarea:focus {
      outline: none;
      border-color: #00ffff;
      box-shadow: 0 0 5px rgba(0, 212, 255, 0.3);
    }

    input, select {
      width: 100%;
      padding: 8px;
      background: #0f3460;
      border: 1px solid #00d4ff;
      color: #eee;
      border-radius: 3px;
      font-size: 14px;
      margin-bottom: 10px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #00ffff;
      box-shadow: 0 0 5px rgba(0, 212, 255, 0.3);
    }

    button {
      background: #00d4ff;
      border: none;
      color: #000;
      padding: 8px 15px;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: background 0.2s;
      margin-right: 5px;
      margin-bottom: 10px;
    }

    button:hover {
      background: #00ffff;
    }

    button:active {
      transform: scale(0.98);
    }

    .button-group {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    #chat {
      background: #0f3460;
      border: 1px solid #00d4ff;
      border-radius: 3px;
      height: 400px;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message {
      margin-bottom: 10px;
      padding: 8px;
      border-radius: 3px;
      word-wrap: break-word;
    }

    .message.user {
      background: #1a472a;
      border-left: 3px solid #00d4ff;
    }

    .message.ai {
      background: #472a1a;
      border-left: 3px solid #ff8c00;
    }

    .message-label {
      font-weight: bold;
      font-size: 12px;
      margin-bottom: 3px;
      opacity: 0.7;
    }

    #chatInput {
      width: calc(100% - 60px);
      display: inline-block;
      margin-right: 5px;
    }

    .chat-send-group {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    .chat-send-group input {
      flex: 1;
      margin-bottom: 0;
    }

    .chat-send-group button {
      margin-bottom: 0;
      width: auto;
      padding: 8px 20px;
    }

    .section {
      margin-bottom: 20px;
    }

    .info-text {
      font-size: 12px;
      color: #aaa;
      margin-top: 5px;
      margin-bottom: 10px;
    }

    .status {
      font-size: 11px;
      padding: 5px;
      background: #0f3460;
      border-radius: 3px;
      margin-top: 5px;
      color: #00d4ff;
    }

    .error {
      background: #3a1a1a;
      color: #ff6b6b;
      padding: 10px;
      border-radius: 3px;
      margin-top: 10px;
      font-size: 12px;
      border-left: 3px solid #ff6b6b;
    }

    .success {
      background: #1a3a1a;
      color: #6bff6b;
      padding: 10px;
      border-radius: 3px;
      margin-top: 10px;
      font-size: 12px;
      border-left: 3px solid #6bff6b;
    }
  </style>
</head>
<body>
  <h1>🌸 Isekai Zero PoC</h1>

  <div class="container">
    <!-- LEFT PANEL: CHARACTER & IMAGE GEN -->
    <div>
      <div class="panel">
        <h2>Character</h2>
        <textarea id="characterJSON" rows="10" placeholder='{"name": "Aurora", "description": "A mysterious elf mage", "personality": "Curious and kind", "appearance_url": ""}'>{
  "name": "Aurora",
  "description": "A mysterious elf mage with silver hair",
  "personality": "Curious, kind, loves books",
  "appearance_url": ""
}</textarea>
        <div class="button-group">
          <button onclick="saveCharacter()">💾 Save</button>
          <button onclick="loadCharacter()">📂 Load</button>
          <button onclick="clearCharacter()">🗑️ Clear</button>
        </div>
        <div id="charStatus" class="status"></div>
      </div>

      <div class="panel">
        <h2>Image Generation</h2>
        <input type="text" id="imagePrompt" placeholder="Describe what you want to generate..." value="A beautiful fantasy character standing in a magical forest">
        <select id="imageModel">
          <option value="wan-2.7-image">Wan 2.7 Image</option>
          <option value="grok-imagine-image">Grok Imagine Image</option>
          <option value="seedream-5-pro">Seedream 5 Pro</option>
        </select>
        <button onclick="generateImage()" style="width: 100%; padding: 10px;">✨ Generate Image</button>
        <div id="imageStatus" class="status"></div>
      </div>
    </div>

    <!-- RIGHT PANEL: CHAT -->
    <div>
      <div class="panel">
        <h2>Chat</h2>
        
        <div class="section">
          <label for="modelSelect" style="font-size: 12px; color: #aaa;">Model:</label>
          <select id="modelSelect" onchange="selectModel()">
            <option value="qwen-3.5-9b">Qwen 3.5 9B</option>
            <option value="deepseek-v3.2">DeepSeek V3.2</option>
            <option value="ernie-5.1">ERNIE 5.1</option>
            <option value="minimax-3">MiniMax 3</option>
          </select>
        </div>

        <div id="chat"></div>

        <div class="chat-send-group">
          <input type="text" id="chatInput" placeholder="Type your message..." onkeypress="if(event.key==='Enter') sendMessage()">
          <button onclick="sendMessage()">Send</button>
        </div>

        <button onclick="clearChat()" style="width: 100%;">🗑️ Clear Chat</button>
        <div id="chatStatus" class="status"></div>
      </div>
    </div>
  </div>

  <!-- CONFIG SECTION -->
  <div class="panel">
    <h2>⚙️ Configuration</h2>
    <div class="info-text">
      To use this app, you need a nanogpt.com API key. Set it below, or paste your key in the prompt and I'll save it.
    </div>
    <input type="password" id="apiKey" placeholder="nanogpt.com API Key (sk-...)">
    <button onclick="saveAPIKey()">Save API Key</button>
    <button onclick="testAPIKey()">🔍 Test Connection</button>
    <div id="apiStatus" class="status"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>

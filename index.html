<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isekai Zero PoC</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 10px;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 15px;
      color: #00d4ff;
      font-size: 24px;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    .panel {
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 5px;
      padding: 12px;
    }

    .panel h2 {
      font-size: 14px;
      margin-bottom: 10px;
      color: #00d4ff;
      border-bottom: 1px solid #0f3460;
      padding-bottom: 8px;
    }

    textarea {
      width: 100%;
      padding: 8px;
      background: #0f3460;
      border: 1px solid #00d4ff;
      color: #eee;
      border-radius: 3px;
      font-family: monospace;
      font-size: 11px;
      resize: vertical;
      margin-bottom: 8px;
    }

    textarea:focus {
      outline: none;
      border-color: #00ffff;
      box-shadow: 0 0 5px rgba(0, 212, 255, 0.3);
    }

    input, select {
      width: 100%;
      padding: 8px;
      background: #0f3460;
      border: 1px solid #00d4ff;
      color: #eee;
      border-radius: 3px;
      font-size: 13px;
      margin-bottom: 8px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #00ffff;
      box-shadow: 0 0 5px rgba(0, 212, 255, 0.3);
    }

    button {
      background: #00d4ff;
      border: none;
      color: #000;
      padding: 8px 12px;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      transition: background 0.2s;
      margin-right: 5px;
      margin-bottom: 8px;
    }

    button:hover {
      background: #00ffff;
    }

    button:active {
      transform: scale(0.98);
    }

    .button-group {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .button-group button {
      flex: 1;
      min-width: 70px;
      margin-right: 0;
    }

    #chat {
      background: #0f3460;
      border: 1px solid #00d4ff;
      border-radius: 3px;
      height: 300px;
      overflow-y: auto;
      padding: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      line-height: 1.4;
    }

    .message {
      margin-bottom: 8px;
      padding: 6px;
      border-radius: 3px;
      word-wrap: break-word;
    }

    .message.user {
      background: #1a472a;
      border-left: 3px solid #00d4ff;
    }

    .message.ai {
      background: #472a1a;
      border-left: 3px solid #ff8c00;
    }

    .message-label {
      font-weight: bold;
      font-size: 11px;
      margin-bottom: 2px;
      opacity: 0.7;
    }

    .chat-send-group {
      display: flex;
      gap: 5px;
      margin-bottom: 8px;
    }

    .chat-send-group input {
      flex: 1;
      margin-bottom: 0;
    }

    .chat-send-group button {
      margin-bottom: 0;
      width: auto;
      padding: 8px 15px;
    }

    .section {
      margin-bottom: 12px;
    }

    .info-text {
      font-size: 11px;
      color: #aaa;
      margin-bottom: 8px;
    }

    .status {
      font-size: 10px;
      padding: 5px;
      background: #0f3460;
      border-radius: 3px;
      margin-top: 5px;
      color: #00d4ff;
      min-height: 16px;
    }

    .error {
      background: #3a1a1a;
      color: #ff6b6b;
      border-left: 3px solid #ff6b6b;
    }

    .success {
      background: #1a3a1a;
      color: #6bff6b;
      border-left: 3px solid #6bff6b;
    }

    /* TABLET (768px+) */
    @media (max-width: 768px) {
      body {
        padding: 8px;
      }

      h1 {
        font-size: 20px;
        margin-bottom: 12px;
      }

      .container {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .panel {
        padding: 10px;
      }

      .panel h2 {
        font-size: 13px;
        margin-bottom: 8px;
        padding-bottom: 6px;
      }

      textarea {
        font-size: 10px;
        padding: 6px;
        margin-bottom: 6px;
      }

      input, select {
        font-size: 12px;
        padding: 6px;
        margin-bottom: 6px;
      }

      button {
        font-size: 11px;
        padding: 6px 10px;
        margin-bottom: 6px;
      }

      #chat {
        height: 250px;
        font-size: 11px;
        padding: 6px;
        margin-bottom: 6px;
      }

      .message {
        margin-bottom: 6px;
        padding: 5px;
      }

      .message-label {
        font-size: 10px;
        margin-bottom: 1px;
      }

      .button-group {
        margin-bottom: 6px;
        gap: 4px;
      }

      .button-group button {
        min-width: 60px;
        padding: 6px 8px;
      }

      .chat-send-group {
        margin-bottom: 6px;
        gap: 4px;
      }

      .chat-send-group button {
        padding: 6px 12px;
      }
    }

    /* MOBILE (480px and below) */
    @media (max-width: 480px) {
      body {
        padding: 6px;
      }

      h1 {
        font-size: 18px;
        margin-bottom: 10px;
      }

      .container {
        gap: 10px;
      }

      .panel {
        padding: 8px;
        border-radius: 3px;
      }

      .panel h2 {
        font-size: 12px;
        margin-bottom: 6px;
        padding-bottom: 5px;
      }

      textarea {
        font-size: 9px;
        padding: 5px;
        margin-bottom: 5px;
        height: 120px !important;
      }

      input, select {
        font-size: 11px;
        padding: 5px;
        margin-bottom: 5px;
      }

      button {
        font-size: 10px;
        padding: 5px 8px;
        margin-bottom: 5px;
        margin-right: 3px;
      }

      .button-group {
        margin-bottom: 5px;
        gap: 3px;
      }

      .button-group button {
        min-width: 50px;
        padding: 5px 6px;
        font-size: 9px;
        margin-right: 0;
      }

      #chat {
        height: 200px;
        font-size: 10px;
        padding: 5px;
        margin-bottom: 5px;
        line-height: 1.3;
      }

      .message {
        margin-bottom: 5px;
        padding: 4px;
      }

      .message-label {
        font-size: 9px;
        margin-bottom: 1px;
      }

      .chat-send-group {
        margin-bottom: 5px;
        gap: 3px;
      }

      .chat-send-group input {
        font-size: 11px;
      }

      .chat-send-group button {
        padding: 5px 10px;
        margin-bottom: 0;
      }

      .section {
        margin-bottom: 8px;
      }

      .info-text {
        font-size: 10px;
        margin-bottom: 6px;
      }

      .status {
        font-size: 9px;
        padding: 4px;
        margin-top: 4px;
      }
    }

    /* EXTRA SMALL (320px) */
    @media (max-width: 360px) {
      button {
        padding: 4px 6px;
        font-size: 9px;
      }

      .button-group button {
        min-width: 45px;
        padding: 4px 4px;
      }

      textarea {
        height: 100px !important;
      }

      #chat {
        height: 150px;
      }
    }
  </style>
</head>
<body>
  <h1>🌸 Isekai Zero PoC</h1>

  <div class="container">
    <!-- LEFT PANEL: CHARACTER & IMAGE GEN -->
    <div>
      <div class="panel">
        <h2>Character</h2>
        <textarea id="characterJSON" rows="8" placeholder='{"name": "Aurora", "description": "A mysterious elf mage", "personality": "Curious and kind", "appearance_url": ""}'>{
  "name": "Aurora",
  "description": "A mysterious elf mage with silver hair",
  "personality": "Curious, kind, loves books",
  "appearance_url": ""
}</textarea>
        <div class="button-group">
          <button onclick="saveCharacter()">💾 Save</button>
          <button onclick="loadCharacter()">📂 Load</button>
          <button onclick="clearCharacter()">🗑️ Clear</button>
        </div>
        <div id="charStatus" class="status"></div>
      </div>

      <div class="panel">
        <h2>Image Generation</h2>
        <input type="text" id="imagePrompt" placeholder="Describe what to generate..." value="A beautiful fantasy character in a magical forest">
        <select id="imageModel">
          <option value="wan-2.7-image">Wan 2.7 Image</option>
          <option value="grok-imagine-image">Grok Imagine Image</option>
          <option value="seedream-5-pro">Seedream 5 Pro</option>
        </select>
        <button onclick="generateImage()" style="width: 100%; padding: 8px;">✨ Generate</button>
        <div id="imageStatus" class="status"></div>
      </div>
    </div>

    <!-- RIGHT PANEL: CHAT -->
    <div>
      <div class="panel">
        <h2>Chat</h2>
        
        <div class="section">
          <label for="modelSelect" style="font-size: 10px; color: #aaa;">Model:</label>
          <select id="modelSelect" onchange="selectModel()">
            <option value="qwen-3.5-9b">Qwen 3.5 9B</option>
            <option value="deepseek-v3.2">DeepSeek V3.2</option>
            <option value="ernie-5.1">ERNIE 5.1</option>
            <option value="minimax-3">MiniMax 3</option>
          </select>
        </div>

        <div id="chat"></div>

        <div class="chat-send-group">
          <input type="text" id="chatInput" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendMessage()">
          <button onclick="sendMessage()">Send</button>
        </div>

        <button onclick="clearChat()" style="width: 100%;">🗑️ Clear</button>
        <div id="chatStatus" class="status"></div>
      </div>
    </div>
  </div>

  <!-- CONFIG SECTION -->
  <div class="panel">
    <h2>⚙️ Configuration</h2>
    <div class="info-text">
      Add your nanogpt.com API key to use this app.
    </div>
    <input type="password" id="apiKey" placeholder="nanogpt.com API Key (sk-...)">
    <div class="button-group">
      <button onclick="saveAPIKey()">Save Key</button>
      <button onclick="testAPIKey()">🔍 Test</button>
    </div>
    <div id="apiStatus" class="status"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
